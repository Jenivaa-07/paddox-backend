name: PADDOX backend gateway check

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check backend JavaScript
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        run: npm test
      - name: Load critical checkout and realtime modules
        run: |
          node - <<'NODE'
          require('./models/Order');
          require('./controllers/order.controller');
          require('./config/socket');
          console.log('PADDOX checkout and realtime modules loaded successfully');
          NODE
