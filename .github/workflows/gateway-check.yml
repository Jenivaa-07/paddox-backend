name: PADDOX backend gateway check

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check backend JavaScript
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        run: npm test
      - name: Check AI gateway modules
        run: |
          node --check services/aiClient.service.js
          node --check controllers/racePrediction.controller.js
          node --check routes/f1.routes.js
      - name: Load critical checkout and realtime modules
        run: |
          node - <<'NODE'
          require('./models/Order');
          require('./controllers/order.controller');
          require('./config/socket');
          require('./services/aiClient.service');
          require('./controllers/racePrediction.controller');
          require('./routes/f1.routes');
          console.log('PADDOX checkout, realtime and AI gateway modules loaded successfully');
          NODE
